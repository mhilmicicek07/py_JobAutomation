<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>{% block title %}JobAutomation{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f7f7f7;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        nav a {
            margin-right: 15px;
            text-decoration: none;
        }
        nav {
            margin-bottom: 25px;
            display: block;
        }
    </style>
</head>
<body>

<nav>
    <a href="{% url 'dashboard' %}">CVs</a>
    <a href="{% url 'quick_apply' %}">Schnellbewerbung</a>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
